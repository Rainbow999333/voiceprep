[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprep"
version = "0.1.0"
description = "Minimal CLI to scan local audio files"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
whisper = [
    "openai-whisper",
]

[project.scripts]
voiceprep = "voiceprep.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
